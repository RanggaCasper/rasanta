# Example : git tag v1.x.x
# Push tag : git push origin v1.x.x

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          APP_NAME="$(basename "$GITHUB_REPOSITORY")"
          VERSION="${GITHUB_REF_NAME}"
          OUT_DIR="dist"
          mkdir -p "$OUT_DIR"

          EXT=""
          if [ "${GOOS}" = "windows" ]; then EXT=".exe"; fi

          # PENTING: build dari cmd/server
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "${OUT_DIR}/${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}${EXT}" \
            ./cmd/server

          (cd "$OUT_DIR" && sha256sum "${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}${EXT}" > "${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}${EXT}.sha256")

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: website
        run: pnpm build

      - name: Package frontend artifact
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist/frontend
          tar -C website -czf "dist/frontend/website_${VERSION}.tar.gz" .output

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release
          path: dist/frontend/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build
      - frontend-build

    steps:
      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: release-assets/backend
          merge-multiple: true

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-release
          path: release-assets/frontend

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Rasanta ${{ github.ref_name }}

            Release ini berisi komponen backend dan frontend yang siap digunakan untuk deployment production.

            ### Backend Binary

            Binary backend tersedia untuk beberapa platform berikut:

            * **Linux**: amd64, arm64
            * **Windows**: amd64, arm64
            * **macOS (Darwin)**: amd64, arm64

            Setiap binary juga disertai dengan **file checksum SHA256** untuk verifikasi integritas file.

            ### Frontend Package

            * `website_${{ github.ref_name }}.tar.gz` - build production dari aplikasi frontend.

            ---

            # Cara Menjalankan Backend (Production)

            ### 1. Download Binary

            Unduh binary sesuai dengan sistem operasi dari **assets release**.

            ### 2. Siapkan Struktur Folder

            Pastikan struktur runtime seperti berikut:

            ```
            rasanta_binary
            .env
            .secrets/google_maps_cookie.txt
            ```

            Contoh:

            ```
            rasanta_${{ github.ref_name }}_windows_amd64.exe
            .env
            .secrets/google_maps_cookie.txt
            ```

            ### 3. Konfigurasi Environment

            Isi file `.env` dengan contoh konfigurasi berikut:

            ```
            PORT=8000
            HTTP_TIMEOUT_SECONDS=30
            GOOGLE_MAPS_COOKIE_FILE=.secrets/google_maps_cookie.txt
            ```

            ### 4. Menjalankan Server

            **Windows (PowerShell)**

            ```
            .\rasanta_${{ github.ref_name }}_windows_amd64.exe
            ```

            **Linux / macOS**

            ```
            ./rasanta_${{ github.ref_name }}_linux_amd64
            ```

            ### 5. Cek Status Server

            Buka endpoint berikut untuk memastikan server berjalan:

            ```
            http://localhost:8000/health
            ```

            ---

            # Cara Menjalankan Frontend (Production)

            ### 1. Extract File

            Extract file berikut:

            ```
            website_${{ github.ref_name }}.tar.gz
            ```

            ### 2. Jalankan Server Nuxt

            Windows (PowerShell):

            ```
            $env:PORT=3000
            $env:NUXT_PUBLIC_API_BASE=https://localhost:8000
            node ./server/index.mjs
            ```

            Linux / macOS:

            ```
            export PORT=3000
            export NUXT_PUBLIC_API_BASE=https://localhost:8000
            node ./server/index.mjs
            ```

            ---

            # Endpoint API Utama

            * `GET /api/v1/places`
            * `GET /api/v1/places/detail`
            * `GET /health`

            ---
          files: |
            release-assets/backend/*
            release-assets/frontend/*
