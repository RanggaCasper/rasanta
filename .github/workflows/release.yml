# Example : git tag v1.x.x
# Push tag : git push origin v1.x.x

name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  backend-build:
    name: Build Backend (Cross-Architecture)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build backend binaries
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist/backend

          # Build for all major server/desktop OS entries returned by Go toolchain.
          while IFS= read -r target; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            EXT=""

            if [[ "${GOOS}" == "windows" ]]; then
              EXT=".exe"
            fi

            OUT="dist/backend/rasanta_${VERSION}_${GOOS}_${GOARCH}${EXT}"
            echo "Building ${target} -> ${OUT}"
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath -ldflags "-s -w" -o "${OUT}" ./cmd/server
          done < <(go tool dist list | grep -E '^(linux|windows|darwin|freebsd|openbsd|netbsd|dragonfly)/')

          (cd dist/backend && sha256sum * > checksums.txt)

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: dist/backend/*
          if-no-files-found: error

  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: website
        run: pnpm build

      - name: Package frontend artifact
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist/frontend
          tar -C website -czf "dist/frontend/website_${VERSION}.tar.gz" .output

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release
          path: dist/frontend/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - frontend-build

    steps:
      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-release
          path: release-assets/backend

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-release
          path: release-assets/frontend

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/backend/*
            release-assets/frontend/*
